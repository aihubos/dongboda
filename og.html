<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동보다 OG</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;margin:0;overflow:hidden;background:#fff}
  body{font-family:'Pretendard',sans-serif;color:#10224F;word-break:keep-all}
  .og{position:relative;width:1200px;height:630px;display:flex}
  .left{flex:1;padding:56px 56px 48px 64px;display:flex;flex-direction:column}
  .logo{height:40px;width:auto;align-self:flex-start}
  .pill{margin-top:44px;align-self:flex-start;background:#EAF0FF;color:#1E5EFF;
    font-weight:700;font-size:24px;padding:10px 20px;border-radius:999px}
  h1{margin-top:24px;font-size:66px;line-height:1.18;font-weight:800;letter-spacing:-0.03em;color:#10224F}
  h1 em{font-style:normal;color:#1E5EFF;display:block}
  .foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:#10224F}
  .foot:before{content:"";width:36px;height:6px;border-radius:3px;background:#1E5EFF}
  .right{width:420px;background:#1E5EFF;color:#fff;padding:56px 44px;display:flex;flex-direction:column;justify-content:center}
  .right .k{font-size:26px;font-weight:600;color:#DCE6FF}
  .right .v{margin-top:8px;font-size:104px;line-height:1.05;font-weight:800;letter-spacing:-0.04em;color:#D8FF6A}
  .right .v small{display:block;font-size:56px;letter-spacing:-0.03em}
  .right .note{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.3);font-size:20px;color:#EAF0FF}
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <img class="logo" src="logo.png" alt="AI BUILDERS LAB">
    <span class="pill">[동탄] 이웃을 위한 무료 보험 점검</span>
    <h1>장보기는 꼼꼼하게,<em>보험료는 자동이체만?</em></h1>
    <div class="foot">동보다 · 동탄 이웃 무료 보험 점검</div>
  </div>
  <div class="right">
    <div class="k">20년이면</div>
    <div class="v">1,200<small>만 원</small></div>
    <div class="note">월 5만 원 × 20년 단순 계산 예시</div>
  </div>
</div>
</body>
</html>
